[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coframe"
version = "0.1.0"
description = "Self-validating adaptive frame meshes for video diffusion transformers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "CoFrame contributors"},
]
dependencies = [
  "torch>=2.4",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
wan21 = [
  "diffusers>=0.31",
  "transformers>=4.49",
  "accelerate>=1.0",
  "einops>=0.8",
  "ftfy>=6.2",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "tqdm>=4.66",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["coframe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

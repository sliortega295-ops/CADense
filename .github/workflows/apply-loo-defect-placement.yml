name: Apply and validate LOO defect placement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply LOO placement update
        run: python tools/apply_loo_defect_placement.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest packaging
          pip install -e . --no-deps --no-build-isolation
      - name: Validate
        run: |
          python -m compileall -q coframe scripts
          bash -n scripts/run_ode_coframe_wan21.sh
          pytest -q
      - name: Commit validated implementation
        run: |
          rm -f tools/apply_loo_defect_placement.py
          rm -f .github/workflows/apply-loo-defect-placement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: restore LOO-defect adaptive frame placement'
          git push origin HEAD:main

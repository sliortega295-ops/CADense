name: Apply and validate ODE CoFrame integration

on:
  push:
    branches: [agent/coframe-ode-path]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coframe-ode-path
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply integration patch
        run: python tools/apply_ode_path_update.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest packaging
          pip install -e . --no-deps --no-build-isolation
      - name: Validate
        run: |
          python -m compileall -q coframe scripts
          bash -n scripts/run_ode_coframe_wan21.sh
          pytest -q
      - name: Commit validated implementation
        run: |
          rm -f tools/apply_ode_path_update.py
          rm -f .github/workflows/ode-coframe-update.yml
          chmod +x scripts/run_ode_coframe_wan21.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement ODE-path-aware CoFrame'
          git push origin HEAD:agent/coframe-ode-path

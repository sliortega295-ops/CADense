name: Apply CoFrame Stage-1b update

on:
  push:
    branches: [agent/coframe-stage1b]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/coframe-stage1b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source update
        run: python tools/apply_stage1b_update.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest packaging
          pip install -e . --no-deps --no-build-isolation
      - name: Validate
        run: |
          python -m compileall -q coframe scripts
          bash -n scripts/run_stage1b_wan21.sh
          bash -n scripts/run_baselines_wan21.sh
          pytest -q
      - name: Commit validated update
        run: |
          rm -f tools/apply_stage1b_update.py .github/workflows/stage1b-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Stage-1b source attribution and FIS baseline'
          git push origin HEAD:agent/coframe-stage1b

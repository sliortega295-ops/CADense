name: Apply CoFrame metrics update

on:
  push:
    branches: [main]
    paths:
      - '.coframe_payload/**'
      - '.github/workflows/coframe-metrics-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify update
        shell: bash
        run: |
          set -euo pipefail
          cat .coframe_payload/part-* | base64 --decode > /tmp/coframe-metrics.tar.gz
          echo '29feb9677c39c8da080a8cddaf064bcf1995e7284616a5fac8a2ea70c3e34233  /tmp/coframe-metrics.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file /tmp/coframe-metrics.tar.gz --directory .
          rm -rf .coframe_payload .github/workflows/coframe-metrics-payload.yml
      - name: Commit verified sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add oracle-grounded CoFrame metrics'
          git push origin HEAD:main
